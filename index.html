<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korus - demo</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root,[data-theme="light"]{--bg:#ffffff;--bg2:#f6f3fd;--card:#ffffff;--card2:#f1ecfb;--fg:#1b1a22;--muted:#6d6b7a;--line:#eae5f7;--red:#7c3aed;--grad:linear-gradient(135deg,#8b5cf6,#6d28d9);--blue:#5b6cf0;--gold:#c8931f;--shadow:0 6px 22px rgba(90,60,170,.10)}
[data-theme="dark"]{--bg:#0d0d11;--bg2:#151319;--card:#18161d;--card2:#221f29;--fg:#f4f2f0;--muted:#a39ba6;--line:#2a2633;--red:#ff7a2f;--grad:linear-gradient(135deg,#ff9a3d,#ff5a1f);--blue:#6ea0ff;--gold:#e0b64a;--shadow:0 6px 22px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.cond,h1,h2,h3,.btn,.chip,.tab,.brandtx{font-family:"Poppins","Inter",sans-serif;letter-spacing:0}
img{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* header */
header{position:sticky;top:0;z-index:40;background:var(--bg);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;height:58px}
.logo{height:30px;cursor:pointer}
.hd-right{display:flex;align-items:center;gap:10px}
.langsel{display:flex;gap:3px}
.langsel button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer;font-weight:700}
.langsel button.on{color:#fff;border-color:var(--red);background:rgba(224,20,43,.14)}
.iconbtn2{background:transparent;border:1px solid var(--line);color:var(--fg);width:38px;height:34px;border-radius:8px;cursor:pointer;font-size:16px}
.iconbtn2:hover{border-color:var(--red)}
.brand{font-family:"Poppins",sans-serif;font-weight:800;font-size:23px;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;line-height:1}
.brandbig{font-family:"Poppins",sans-serif;font-weight:800;font-size:44px;letter-spacing:-1.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 auto 10px;line-height:1}
.post,.genrecard,.taste,.stile,.revform,.muralbox{box-shadow:var(--shadow)}
.pmural{padding:0 14px 14px}
.cmbox{display:flex;gap:8px;margin-bottom:10px}
.cmbox textarea{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 11px;font-size:13px;min-height:46px;resize:vertical;font-family:inherit}
/* menu overlay */
.menu{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none}
.menu.on{display:block}
.menu .panel{position:absolute;top:0;right:0;width:min(320px,86vw);height:100%;background:var(--bg2);border-left:1px solid var(--line);padding:20px}
.menu a{display:flex;align-items:center;gap:12px;padding:14px 10px;color:var(--fg);text-decoration:none;font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);cursor:pointer}
.menu a:hover{color:var(--red)}
.menu a img{width:26px;height:26px;object-fit:contain}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--grad);color:#fff;border:none;padding:12px 22px;border-radius:8px;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.btn:hover{filter:brightness(1.1)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.section-title{text-transform:uppercase;font-size:19px;font-weight:800;letter-spacing:.06em}
.sub{color:var(--muted);font-size:13px}
.hidden{display:none!important}
.demopill{font-size:9px;font-weight:800;letter-spacing:.1em;color:#000;background:var(--gold);padding:2px 6px;border-radius:4px;vertical-align:middle;margin-left:8px}
/* onboarding hero */
.lhero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);border-radius:0 0 14px 14px;margin-top:-4px}
.lback{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);opacity:.26;filter:blur(1px)}
.lback img,.lback .ph{width:100%;aspect-ratio:1;object-fit:cover;background:#20262e}
.lveil{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(20,24,28,.5),rgba(20,24,28,.94) 78%)}
.lhinner{position:relative;z-index:2;text-align:center;padding:60px 20px 40px;max-width:820px;margin:0 auto}
.lhinner img.llogo{height:52px;margin:0 auto 16px;filter:drop-shadow(0 4px 16px rgba(0,0,0,.6))}
.lhinner h1{font-size:44px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;line-height:1;margin-bottom:14px;font-family:"Poppins","Inter",sans-serif}
.lhinner h1 .r{color:var(--red)}
.lhinner .vp{font-size:17px;color:var(--muted);line-height:1.5;max-width:620px;margin:0 auto 18px}
.lsteps{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;margin:2px auto 14px;max-width:700px}
.lsteps .st{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.lsteps .st b{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 24px;font-family:"Arial Narrow",sans-serif}
.lhint{color:var(--muted);font-size:13px}.lhint b{color:var(--fg)}
.gstrip{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:6px 0 10px}
.gstrip .g{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;opacity:.85;width:92px}
.gstrip .g:hover{opacity:1}
.gstrip .g img{height:58px;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.gstrip .g span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.03em;text-align:center}
.inputs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 6px}
.inputs input{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:10px 12px;border-radius:8px;font-size:14px;width:210px}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 16px;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.chip img{width:18px;height:18px;object-fit:contain}
.chip.on{color:#fff;border-color:var(--red);background:rgba(224,20,43,.14)}
/* band grid (onboarding) */
.bandgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding-bottom:12px}
.bandcard{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--card2);border:2px solid transparent}
.bandcard .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .3s}
.bandcard:hover .bg{transform:scale(1.06)}
.bandcard .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 30%,rgba(0,0,0,.85))}
.bandcard .nm{position:absolute;left:10px;right:10px;bottom:8px;font-weight:800;font-size:15px;line-height:1.05;z-index:2}
.bandcard .st{position:absolute;left:10px;bottom:-2px}
.bandcard .dot{position:absolute;top:9px;left:9px;width:10px;height:10px;border-radius:50%;z-index:2;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.bandcard.on{border-color:var(--red)}
.bandcard .chk{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:none;align-items:center;justify-content:center;font-size:15px;z-index:3}
.bandcard.on .chk{display:flex}
/* seed bar */
.seedbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:12px 16px;z-index:45}
.seedbar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.seedbar .cnt{font-size:13px;color:var(--muted)}
/* profile header */
.phead{display:flex;align-items:center;gap:16px;padding:22px 0 6px}
.avatar{width:64px;height:64px;border-radius:50%;flex:0 0 64px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff;background:var(--grad);font-family:"Arial Narrow",sans-serif}
.phead .nm{font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.phead .stat{color:var(--muted);font-size:12.5px;margin-top:2px}
.phead .stat b{color:var(--fg)}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:8px;overflow-x:auto}
.tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:12px 14px;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--red)}
/* rows */
.rowhead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.posterrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.postergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.poster{flex:0 0 150px;scroll-snap-align:start}
.postergrid .poster{flex:none;width:auto}
.pcov{position:relative;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:var(--card2)}
.pcov img{width:100%;height:100%;object-fit:cover}
.pcov .fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;color:#fff}
.pcov .plbadge{position:absolute;left:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;padding-left:2px;cursor:pointer;transition:background .15s,transform .1s;z-index:3}
.pcov .plbadge:hover{background:var(--red);border-color:var(--red);transform:scale(1.08)}
.pcov .plbadge.on{background:var(--red);border-color:var(--red);padding-left:0}
.pcov .pg{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15);display:none}
.pcov .pg.on{display:block}.pcov .pg i{display:block;height:100%;width:0;background:var(--red)}
.pact{display:flex;gap:6px;margin-top:7px}
.pa{flex:1;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:7px;padding:6px 0;font-size:13px;cursor:pointer;text-align:center}
.pa.like:hover{border-color:#27ae60;color:#27ae60}.pa.save:hover{border-color:var(--blue);color:var(--blue)}.pa.skip:hover{border-color:var(--muted)}
.ptt{font-weight:700;font-size:13px;margin-top:6px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbd{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwhy{font-size:10.5px;color:var(--blue);margin-top:2px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwhy.exp{color:var(--gold)}
/* text cards (news/shows) */
.txtrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.txtcard{flex:0 0 240px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;scroll-snap-align:start}
.txtcard .k{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.txtcard .m{font-size:14px;margin-top:6px;line-height:1.3}
.txtcard .s{font-size:12px;color:var(--muted);margin-top:6px}
/* carousel arrows */
.posterrow,.txtrow{scrollbar-width:none;-ms-overflow-style:none}
.posterrow::-webkit-scrollbar,.txtrow::-webkit-scrollbar{display:none}
.rowwrap{position:relative}
.arrow{position:absolute;top:38%;transform:translateY(-50%);z-index:6;width:40px;height:40px;border-radius:50%;background:rgba(20,24,28,.92);border:1px solid var(--line);color:#fff;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.5)}
.arrow:hover{border-color:var(--red);background:#000}
.arrow.left{left:-4px}.arrow.right{right:-4px}
.arrow.hide{display:none}
/* stats */
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:6px 0 12px}
.stile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stile .n{font-size:26px;font-weight:800;font-family:"Arial Narrow",sans-serif;line-height:1}
.stile .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.blockt{text-transform:uppercase;font-size:15px;font-weight:800;letter-spacing:.06em;margin:22px 0 10px}
.gbar{margin-bottom:8px}
.gbar .lab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.gbar .lab .dotg{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.gbar .tk{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}.gbar .tk i{display:block;height:100%}
.fanrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.fanrow img{width:30px;height:30px;object-fit:contain}
.fanbadge{margin-left:auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:4px 11px;border-radius:20px}
.streakgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.stk .n{font-size:24px;font-weight:800;font-family:"Arial Narrow",sans-serif}.stk .n span{font-size:14px;color:var(--muted)}
.stk .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.addform{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.addform input{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:9px 11px;border-radius:8px;font-size:13px}
.attcard{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.attcard .d{margin-left:auto;color:var(--muted);font-size:12px}
/* ratings / artist-album pages */
.ptt,.pbd{cursor:pointer}.ptt:hover{color:var(--red)}.pbd:hover{color:var(--fg)}
.star{color:#3a3a44}.star.on{color:var(--gold)}
.formstars .pstar{font-size:32px;color:#3a3a44;cursor:pointer;padding:0 2px}.formstars .pstar.on{color:var(--gold)}
.crumb{color:var(--muted);font-size:13px;cursor:pointer;margin:14px 0 4px;display:inline-block}.crumb:hover{color:var(--red)}
.pghero{display:flex;gap:18px;align-items:flex-start;margin:8px 0 12px;flex-wrap:wrap}
.pghero .art{width:150px;height:150px;border-radius:10px;object-fit:cover;background:var(--card2);flex:0 0 150px}
.pghero .art.emb{object-fit:contain;padding:16px}
.pgtitle{font-size:30px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;font-family:"Poppins","Inter",sans-serif}
.aggrow{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.aggrow .num{font-size:26px;font-weight:800;font-family:"Arial Narrow",sans-serif}
.aggrow .cnt{color:var(--muted);font-size:13px}
.revform{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
.revform textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:10px;font-size:14px;min-height:70px;margin:8px 0;resize:vertical;font-family:inherit}
.rev{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rev .av{width:38px;height:38px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 38px;font-family:"Arial Narrow",sans-serif}
.rev .who{font-weight:700;font-size:13px}.rev .date{color:var(--muted);font-size:11px;font-weight:400}
.rev .txt{font-size:13px;margin-top:4px;color:var(--fg)}
.muralbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.muralbox textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:10px;font-size:14px;min-height:56px;resize:vertical;font-family:inherit;margin-bottom:8px}
.cmt{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.cmt .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#123);display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 36px;font-family:"Arial Narrow",sans-serif}
.cmt .who{font-weight:700;font-size:13px}.cmt .txt{font-size:13.5px;margin-top:3px;color:var(--fg);line-height:1.4}
.cmt .clike{background:transparent;border:none;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.cmt .clike.on{color:var(--red)}
.tipwrap{margin-top:12px}
.tipbtn{background:var(--grad);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:13px;cursor:pointer}
.tipbox{display:none;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}.tipbox.on{display:flex}
.tipamt{background:var(--card);border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:8px 14px;font-weight:800;cursor:pointer}
.tipamt:hover{background:var(--gold);color:#000}
.tipnote{font-size:10px;color:var(--muted);text-transform:uppercase}
.reels{margin:8px 0 6px}
.reelrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.reelrow::-webkit-scrollbar{display:none}
.reel{flex:0 0 150px;scroll-snap-align:start}
.rcov{position:relative;aspect-ratio:9/14;border-radius:16px;overflow:hidden;background:var(--card2);cursor:pointer}
.rfb{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 6s ease}
.rcov:hover .rfb{transform:scale(1.08)}
.rgrad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 38%,rgba(0,0,0,.82))}
.rtag{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;text-transform:uppercase;color:#fff;padding:3px 8px;border-radius:20px;letter-spacing:.03em}
.rplay{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.55);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding-left:3px}
.rplay:hover,.rplay.on{background:var(--red);border-color:var(--red)}
.rprog{position:absolute;left:0;right:0;bottom:50px;height:3px;background:rgba(255,255,255,.25);display:none}.rprog.on{display:block}.rprog i{display:block;height:100%;width:0;background:var(--red)}
.rmeta{position:absolute;left:10px;right:10px;bottom:9px}
.rtt{font-weight:800;font-size:13px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.rbd{font-size:11px;color:#e6e9ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ryt{display:inline-block;margin-top:5px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.35);padding:2px 8px;border-radius:20px;text-decoration:none}
.ryt:hover{background:var(--red);border-color:var(--red)}
.feedwrap{max-width:544px;margin:0 auto}
.post{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:18px;overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:12px 14px}
.phead .pav{width:38px;height:38px;border-radius:50%;flex:0 0 38px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:"Arial Narrow",sans-serif;color:#fff;cursor:pointer;overflow:hidden;background-size:cover}
.phead .pnm{font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .pctx{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.pmedia{position:relative;aspect-ratio:1/1;background:var(--card2);cursor:pointer}
.pmfb{position:absolute;inset:0;background-size:cover;background-position:center}
.pmplay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.55);color:#fff;font-size:18px;cursor:pointer;padding-left:4px}
.pmplay:hover,.pmplay.on{background:var(--red);border-color:var(--red)}
.pmprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25);display:none}.pmprog.on{display:block}.pmprog i{display:block;height:100%;width:0;background:var(--red)}
.pmyt{position:absolute;right:10px;top:10px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.3);padding:2px 8px;border-radius:20px;text-decoration:none}
.pacts{display:flex;gap:18px;padding:10px 14px 4px;align-items:center}
.pa2{background:transparent;border:none;color:var(--fg);font-size:15px;cursor:pointer;display:flex;align-items:center;gap:5px}
.pa2 .ct{font-size:13px}.pa2.like.on{color:var(--red)}.pa2:hover{color:var(--red)}
.pcap{padding:2px 14px 4px;font-size:14px;cursor:pointer}
.ptopc{padding:0 14px 2px;font-size:13px;color:var(--fg)}
.pviewc{padding:2px 14px 12px;font-size:12.5px;color:var(--muted);cursor:pointer}.pviewc:hover{color:var(--fg)}
/* genres grid */
.genregrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:16px}
.genrecard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 12px;text-align:center;cursor:pointer;transition:transform .12s,border-color .15s}
.genrecard:hover{transform:translateY(-3px);border-color:var(--red)}
.genrecard img{height:96px;margin:0 auto 10px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.genrecard .gn{font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.03em}
.genrecard .gc{font-size:11px;color:var(--muted);margin-top:3px}
/* taste bars */
.taste{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:520px}
.pt{margin-bottom:9px}
.pt .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}
.pt .tk{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.pt .tk i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--red));transition:width .5s}
.flash{animation:fl .7s ease}@keyframes fl{0%{background:rgba(46,134,222,.18)}100%{background:var(--card)}}
.genrehero{display:flex;align-items:center;gap:16px;margin:18px 0 4px}
.genrehero img{height:80px;object-fit:contain}
.about{margin:30px 0 40px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px}
.about h3{text-transform:uppercase;font-size:14px;letter-spacing:.06em;margin-bottom:8px;color:var(--muted)}
.about p{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:7px}.about b{color:#d7dbe0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#000;border:1px solid var(--red);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.empty{color:var(--muted);font-size:14px;padding:30px 0;text-align:center}
</style>
</head>

/* ---- vectors / recommender ---- */
const tagset=b=>[...b.tags,"style:"+b.style,"sub:"+b.sub];
const df={},N=bands.length; bands.forEach(b=>new Set(tagset(b)).forEach(x=>df[x]=(df[x]||0)+1));
const IDF={}; Object.keys(df).forEach(x=>IDF[x]=Math.log(1+N/df[x]));
function vec(b){const v={};let ss=0;new Set(tagset(b)).forEach(x=>{v[x]=IDF[x];ss+=IDF[x]*IDF[x];});const n=Math.sqrt(ss)||1;for(const k in v)v[k]/=n;return v;}
const BVEC={}; bands.forEach(b=>BVEC[b.id]=vec(b));
const dot=(a,b)=>{let s=0;for(const k in a)if(b[k])s+=a[k]*b[k];return s;};
const addI=(a,v,s)=>{for(const k in v)a[k]=(a[k]||0)+v[k]*s;};
const norm=v=>{let ss=0;for(const k in v)ss+=v[k]*v[k];const n=Math.sqrt(ss)||1;for(const k in v)v[k]/=n;return v;};
const bandById={}; bands.forEach(b=>bandById[b.id]=b);
const cleanTag=x=>x.replace(/^sub:/,"").replace(/^style:/,"");

function streakDays(){ let n=0,day=86400000,cur=new Date(); for(;;){const k=cur.toISOString().slice(0,10); if(activeDates.has(k)){n++;cur=new Date(cur.getTime()-day);}else break;} return n||1; }

function scoredPool(){
  const pool=[]; bands.forEach(b=>{ if(seeds.has(b.id))return; b.tracks.forEach(tr=>{ if(!acted.has(tr.id))pool.push({b,tr}); }); });
  return pool.map(p=>{const sim=dot(profile,BVEC[p.b.id]);return {p,sim,adj:sim-0.18*((p.b.pop-1)/4)};}).sort((a,b)=>b.adj-a.adj);
}
function topTags(k){return Object.entries(profile).filter(([x])=>!x.startsWith("style:")).sort((a,b)=>b[1]-a[1]).slice(0,k).map(x=>x[0]);}
function forYou(n){
  const sc=scoredPool().slice(0,60); const picked=[],ub=new Set();
  while(picked.length<n&&sc.length){let best=-1e9,bi=-1;
    for(let i=0;i<sc.length;i++){const c=sc[i];let ms=0;picked.forEach(pk=>{const s=dot(BVEC[c.p.b.id],BVEC[pk.p.b.id]);if(s>ms)ms=s;});
      const sco=c.adj-0.35*ms-(ub.has(c.p.b.id)?0.15:0);if(sco>best){best=sco;bi=i;}}
    const ch=sc.splice(bi,1)[0];ub.add(ch.p.b.id);picked.push(ch);}
  const tpt=topTags(6);
  return picked.map(x=>({track:x.p.tr,band:x.p.b,why:tagset(x.p.b).filter(t=>tpt.includes(t)).map(cleanTag).slice(0,2),explore:false}));
}
function hiddenGems(n){
  const sc=scoredPool().slice(20,140).filter(x=>x.p.b.pop<=3).sort((a,b)=>(a.p.b.pop-b.p.b.pop)||(b.sim-a.sim));
  const out=[],ub=new Set();
  for(const e of sc){ if(ub.has(e.p.b.id))continue; ub.add(e.p.b.id); out.push({track:e.p.tr,band:e.p.b,why:[],explore:true}); if(out.length>=n)break; }
  return out;
}
function becauseLiked(n){

  let src=null,bestw=-1; seeds.forEach(id=>{const w=dot(profile,BVEC[id]);if(w>bestw){bestw=w;src=id;}});

function fromYourGenres(n){ const gset=new Set([...seeds].map(id=>bandById[id].style));
  const out=[],ub=new Set(); for(const e of scoredPool()){ if(!gset.has(e.p.b.style)||ub.has(e.p.b.id))continue; ub.add(e.p.b.id); out.push({track:e.p.tr,band:e.p.b,why:[],explore:false}); if(out.length>=n)break; } return out; }

/* ---- Deezer JSONP (runtime) ---- */
let jn=0;
function jsonp(url){return new Promise(res=>{const cb="__dz"+(jn++);let done=false;const s=document.createElement("script");
  const cl=()=>{try{delete window[cb]}catch(e){window[cb]=undefined}if(s.parentNode)s.parentNode.removeChild(s);};
  window[cb]=d=>{done=true;cl();res(d);}; s.onerror=()=>{if(!done){cl();res(null);}}; s.src=url+"&output=jsonp&callback="+cb;
  document.body.appendChild(s); setTimeout(()=>{if(!done){cl();res(null);}},6000);});}
const trkCache={},artCache={};
async function getTrack(b,tr){ if(trkCache[tr.id]!==undefined)return trkCache[tr.id];
  const q=encodeURIComponent('artist:"'+b.dz+'" track:"'+tr.title+'"');
  const d=await jsonp("https://api.deezer.com/search?q="+q+"&limit=1");
  let r={failed:true}; if(d&&d.data&&d.data.length){const x=d.data[0];r={preview:x.preview||null,cover:(x.album&&(x.album.cover_medium||x.album.cover))||null};}
  trkCache[tr.id]=r; return r; }
async function getArtist(b){ if(artCache[b.id]!==undefined)return artCache[b.id];
  const d=await jsonp("https://api.deezer.com/search/artist?q="+encodeURIComponent(b.dz)+"&limit=1");
  let r=null; if(d&&d.data&&d.data.length)r=d.data[0].picture_medium||d.data[0].picture; artCache[b.id]=r||""; return artCache[b.id]; }

    +'<div class="stat"><b>'+st.seeds+'</b> '+t("seeds")+' · <b>'+st.saved+'</b> '+t("saved")+' · '+t("topgenre")+': <b>'+st.top+'</b>'+(uCity?' · 📍 '+uCity:'')+'</div></div></div>';
}
function tabbar(active){ const tabs=[["feed",t("feed")],["discover",t("discover")],["genres",t("genres")],["collection",t("collection")],["concerts",t("concerts")],["profile",t("profile")]];
  return '<div class="tabs">'+tabs.map(([k,l])=>'<button class="tab'+(active===k?" on":"")+'" data-v="'+k+'">'+l+'</button>').join("")+'</div>'; }
function tasteBars(){ const tags=Object.entries(profile).filter(([x])=>!x.startsWith("style:")).sort((a,b)=>b[1]-a[1]).slice(0,8); const mx=tags.length?tags[0][1]:1;
  return '<div class="taste" id="tastebox"><h3 class="section-title" style="font-size:15px;margin-bottom:12px">'+t("taste")+'</h3>'
    +tags.map(([tg,w])=>'<div class="pt"><div class="lab"><span>'+cleanTag(tg)+'</span><span>'+Math.round(w/mx*100)+'</span></div><div class="tk"><i style="width:'+Math.round(w/mx*100)+'%"></i></div></div>').join("")+'</div>'; }

function renderApp(){
  const v = (view==="onb")?"feed":view;
  const active = (v==="genre")?"genres":v;
  const a=$("#app"); a.innerHTML=profileHeader()+tabbar(active);
  const body=document.createElement("div"); a.appendChild(body);
  if(v==="feed"){ body.appendChild(feedView());
  } else if(v==="discover"){
    body.appendChild(row(t("for_you"),forYou(14),{grid:true}));
    const bl=becauseLiked(12); if(bl.band) body.appendChild(row(t("because_liked")+" "+bl.band.name,bl.items,{why:false}));
    body.appendChild(row(t("hidden"),hiddenGems(12)));
    const fa=fansAlsoLike(12); if(fa.band) body.appendChild(row(fa.band.name+" · "+t("fans_also"),fa.items,{why:false}));
    body.appendChild(row(t("from_genres"),fromYourGenres(12),{why:false}));
    body.appendChild(row(t("deep_cuts"),deepCuts(12)));
    body.appendChild(row(t("trending"),trendingClub(12),{why:false}));
    body.appendChild(row(t("complete_coll"),completeCollection(12),{why:false}));
  } else if(v==="genres"){ body.appendChild(genresGrid());
  } else if(v==="genre"){ body.appendChild(genreDetail(curGenre));
  } else if(v==="collection"){ body.appendChild(collectionView());
  } else if(v==="concerts"){ body.appendChild(concertsView());
  } else if(v==="profile"){ body.appendChild(profileView());
  } else if(v==="artist"){ body.appendChild(artistView(curArtist));
  } else if(v==="album"){ body.appendChild(albumView(curAlbum)); }
  a.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view=b.dataset.v;stopAudio();renderApp();window.scrollTo(0,0);});
}

function elFromHTML(h){const t=document.createElement("div");t.innerHTML=h;return t.firstElementChild;}

/* ---- artist / album pages + ratings ---- */
function starsDisplay(avg,size){let h='';for(let i=1;i<=5;i++)h+='<span class="star'+(i<=Math.round(avg)?' on':'')+'" style="font-size:'+(size||16)+'px">★</span>';return h;}
function ensureRating(kind,id,pop){const k=kind+":"+id;
  if(!ratings[k]){const base=Math.min(5,3.4+(pop||3)*0.3); const cnt=(pop||3)*31+((id.length*7)%37)+9;
    ratings[k]={seedAvg:Math.round(base*10)/10,seedCount:cnt,reviews:[],
      seed:[{user:"Metalhead"+((id.length*13)%89+10),stars:Math.max(3,Math.round(base)),text:t("seed_review_1"),date:"2026-05-12"},
            {user:"RiffRaider",stars:Math.min(5,Math.max(3,Math.round(base))),text:t("seed_review_2"),date:"2026-06-03"}]};}
  return ratings[k];}
function aggRating(r){const uS=r.reviews.reduce((s,x)=>s+x.stars,0),uN=r.reviews.length,total=r.seedCount+uN;
  return {avg:Math.round((r.seedAvg*r.seedCount+uS)/(total||1)*10)/10,count:total};}
function reviewsList(r){const all=r.reviews.concat(r.seed||[]); if(!all.length)return '<div class="empty">'+t("no_reviews")+'</div>';
  return all.map(rv=>'<div class="rev"><div class="av">'+rv.user[0].toUpperCase()+'</div><div style="flex:1"><div class="who">'+rv.user+' <span class="date">· '+rv.date+'</span></div><div>'+starsDisplay(rv.stars,13)+'</div><div class="txt">'+rv.text+'</div></div></div>').join("");}
function reviewForm(){ return '<div class="revform"><div style="font-weight:700;font-size:13px;margin-bottom:6px">'+t("rate_this")+'</div>'
  +'<div class="formstars" id="formstars">'+[1,2,3,4,5].map(i=>'<span class="pstar" data-v="'+i+'">★</span>').join("")+'</div>'
  +'<textarea id="revtext" placeholder="'+t("your_review_ph")+'"></textarea>'
  +'<button class="btn" id="revsubmit" style="padding:9px 16px;font-size:13px">'+t("submit_review")+'</button></div>'; }
function wireReviewForm(kind,id,pop){ pendingStars=0; setTimeout(()=>{
    const fs=$("#formstars"); if(fs)fs.querySelectorAll(".pstar").forEach(st=>st.onclick=()=>{pendingStars=+st.dataset.v;fs.querySelectorAll(".pstar").forEach(x=>x.classList.toggle("on",+x.dataset.v<=pendingStars));});
    const sb=$("#revsubmit"); if(sb)sb.onclick=()=>submitReview(kind,id,pop); },0); }
function submitReview(kind,id,pop){ const r=ensureRating(kind,id,pop); const txt=(($("#revtext")||{}).value||"").trim();
  if(!pendingStars){toast(t("rate_this"));return;}
  r.reviews.unshift({user:(uName||"You").trim()||"You",stars:pendingStars,text:txt||"—",date:today()});
  const b = kind==="artist"?bandById[id]:bandById[curAlbum.bid]; if(b){logInt(b.style,"review");addI(profile,BVEC[b.id],0.5);norm(profile);}
  toast(t("review_thanks")); renderApp(); window.scrollTo(0,0); }
let comments={};
function seedComments(tid){ if(comments[tid])return comments[tid];
  comments[tid]=[{user:"fa_"+((tid.length*7)%90+10),text:t("seed_comment_1"),likes:120+((tid.length*13)%400),liked:false},{user:"torcedor"+((tid.length*3)%80+10),text:t("seed_comment_2"),likes:40+((tid.length*11)%200),liked:false}]; return comments[tid]; }
function renderMuralList(el,tid){ el.innerHTML=""; const arr=(comments[tid]||[]).slice().sort((a,b)=>b.likes-a.likes);
  arr.forEach(c=>{ const row=document.createElement("div"); row.className="cmt";
    row.innerHTML='<div class="av">'+c.user[0].toUpperCase()+'</div><div style="flex:1"><div class="who">'+c.user+'</div><div class="txt">'+c.text+'</div></div><button class="clike'+(c.liked?" on":"")+'">&#10084; '+c.likes+'</button>';
    row.querySelector(".clike").onclick=()=>{ if(c.liked){c.likes--;c.liked=false;}else{c.likes++;c.liked=true;} renderMuralList(el,tid); }; el.appendChild(row); }); }
function postComment(tid,b){ const ta=$("#mtext"); const tx=((ta&&ta.value)||"").trim(); if(!tx)return;
  seedComments(tid).unshift({user:(uName||"Torcedor").trim()||"Torcedor",text:tx,likes:0,liked:false}); if(ta)ta.value="";
  if(b){logInt(b.style,"like");} renderMuralList($("#murallist"),tid); toast(t("comment_posted")); }
function muralSection(tid,b){ seedComments(tid); const d=document.createElement("div"); d.style.marginTop="22px";
  d.innerHTML='<div class="blockt">'+t("mural_title")+'</div><div class="muralbox"><textarea id="mtext" placeholder="'+t("mural_ph")+'"></textarea><button class="btn" id="mpost" style="padding:8px 16px;font-size:13px">'+t("post")+'</button></div><div id="murallist"></div>';
  renderMuralList(d.querySelector("#murallist"),tid); setTimeout(()=>{const p=$("#mpost"); if(p)p.onclick=()=>postComment(tid,b);},0); return d; }
function wireTip(b){ const btn=$("#tipbtn"), box=$("#tipbox"); if(!btn||!box)return;
  btn.onclick=()=>{ if(box.classList.contains("on")){box.classList.remove("on");box.innerHTML="";return;}
    box.classList.add("on"); box.innerHTML=[5,10,25,50].map(v=>'<button class="tipamt" data-v="'+v+'">R$'+v+'</button>').join("")+'<span class="tipnote">demo</span>';
    box.querySelectorAll(".tipamt").forEach(x=>x.onclick=()=>{toast(t("support_thanks").replace("%s",b.name)+" R$"+x.dataset.v);box.classList.remove("on");box.innerHTML="";}); }; }
function openArtist(bid){ pageReturn={view:(view==="onb"?"feed":view),genre:curGenre}; curArtist=bid; view="artist"; stopAudio(); renderApp(); window.scrollTo(0,0); }
function openAlbum(tid,bid){ pageReturn={view:(view==="onb"?"feed":view),genre:curGenre}; curAlbum={tid:tid,bid:bid}; view="album"; stopAudio(); renderApp(); window.scrollTo(0,0); }
function pageBack(){ curGenre=pageReturn.genre||curGenre; view=pageReturn.view||"feed"; renderApp(); window.scrollTo(0,0); }
function artistView(bid){ const b=bandById[bid]; const r=ensureRating("artist",bid,b.pop); const a=aggRating(r); const d=document.createElement("div");
  d.appendChild(elFromHTML('<div class="crumb">← '+t("back")+'</div>'));

  const rv=document.createElement("div"); rv.innerHTML='<div class="blockt">'+t("reviews")+' ('+a.count+')</div>'+reviewsList(r); d.appendChild(rv);

function albumView(o){ const b=bandById[o.bid]; const tr=(b.tracks.find(x=>x.id===o.tid))||{title:"?",id:o.tid}; const r=ensureRating("album",o.tid,b.pop); const a=aggRating(r); const d=document.createElement("div");
  d.appendChild(elFromHTML('<div class="crumb">← '+t("back")+'</div>'));

  d.appendChild(hero);
  d.appendChild(elFromHTML(reviewForm()));
  const rv=document.createElement("div"); rv.innerHTML='<div class="blockt">'+t("reviews")+' ('+a.count+')</div>'+reviewsList(r); d.appendChild(rv);

  getTrack(b,tr).then(res=>{if(res&&res.cover){const c=hero.querySelector("#albcov");c.innerHTML='<img src="'+res.cover+'" style="width:100%;height:100%;object-fit:cover">';c.style.background="";}});

function renderMenu(){ const links=[["feed",t("feed")],["discover",t("discover")],["genres",t("genres")],["collection",t("collection")],["concerts",t("concerts")],["profile",t("profile")]];
  let h=''; if(view!=="onb"){ h=links.map(([k,l])=>'<a data-v="'+k+'">'+l+'</a>').join(""); }
  h+='<a data-v="__restart">'+t("restart")+'</a>';
  $("#menupanel").innerHTML=h;
  $("#menupanel").querySelectorAll("a").forEach(x=>x.onclick=()=>{const v=x.dataset.v;$("#menu").classList.remove("on");
    if(v==="__restart"){reset();return;} if(view==="onb")return; view=v;stopAudio();renderApp();window.scrollTo(0,0);}); }
function renderAbout(){ $("#aboutbox").innerHTML='<h3>'+t("about_t")+'</h3>'+t("about").map(p=>'<p>'+p.replace(/REAL:/g,"<b>REAL:</b>").replace(/DEMO:/g,"<b>DEMO:</b>")+'</p>').join(""); }
function renderStatic(){ applyTheme(); renderAbout(); if(view==="onb")renderOnb(); else renderApp(); }

function start(){ profile={}; seeds.forEach(id=>addI(profile,BVEC[id],1)); norm(profile);
  interactions=[]; seeds.forEach(id=>logInt(bandById[id].style,"seed")); activeDates.add(today());
  view="feed"; $("#onb").classList.add("hidden"); $("#seedbar").classList.add("hidden"); $("#app").classList.remove("hidden"); renderApp(); window.scrollTo(0,0); }
function reset(){ stopAudio(); seeds=new Set();profile={};acted=new Set();saved=[];view="onb";curGenre=null;filter="__all";
  counts={like:0,save:0,skip:0,play:0};playedIds=new Set();interactions=[];attended=[];activeDates=new Set();
  $("#app").classList.add("hidden"); $("#onb").classList.remove("hidden"); renderOnb(); window.scrollTo(0,0); }

$("#logo").onclick=()=>{ if(view!=="onb"){ view="feed"; stopAudio(); renderApp(); window.scrollTo(0,0); } };
let theme="light"; function applyTheme(){ document.documentElement.setAttribute("data-theme",theme); const tb=$("#themebtn"); if(tb)tb.innerHTML=(theme==="light")?"&#9790;":"&#9728;"; }
$("#themebtn").onclick=()=>{ theme=(theme==="light")?"dark":"light"; applyTheme(); };
$("#menuBtn").onclick=()=>{renderMenu();$("#menu").classList.add("on");};
$("#menu").onclick=e=>{if(e.target.id==="menu")$("#menu").classList.remove("on");};
$("#btnStart").onclick=start;
$("#langsel").querySelectorAll("button").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;$("#langsel").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));renderStatic();});
let toastT=null; function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),1400);}

renderStatic();
</script>
